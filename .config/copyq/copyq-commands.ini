7\Command="copyq:\nvar MAX_LINES = 2;\nvar NL = String.fromCharCode(10);\nvar html = str(data(mimeHtml));\nvar text = str(data(mimeText));\nvar lines = text.split(NL);\nif (html) {\n    var d = html.replace(/<br[^>]*>/gi, NL);\n    d = d.replace(new RegExp('</(p|div|li|tr|h[1-6]|blockquote|pre|section|article|header|footer|td|th|ul|ol)>', 'gi'), NL);\n    d = d.replace(/<[^>]+>/g, '');\n    d = d.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>');\n    var dl = d.split(NL);\n    var clean = [];\n    for (var i = 0; i < dl.length; ++i) {\n        if (dl[i].trim() != '')\n            clean.push(dl[i]);\n    }\n    if (clean.length > lines.length)\n        lines = clean;\n}\nif (lines.length > MAX_LINES) {\n    var hidden = lines.length - MAX_LINES;\n    if (html)\n        removeData(mimeHtml);\n    setData(mimeText, lines.slice(0, MAX_LINES).join(NL) + NL + '… (+' + hidden + ' lines)');\n}"
7\Display=true
7\Name=Limit text lines display
